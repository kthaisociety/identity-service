# Checks on every PR. Both jobs are required checks on main.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # PRs are squash-merged, so the title becomes the commit release-please reads.
  title:
    uses: kthaisociety/workflows/.github/workflows/semantic-pr.yml@v0.2.0
    permissions:
      pull-requests: read

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A throwaway Postgres for the database tests (docs/pcr/0005).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-backend
